{% extends 'core/base.html' %}

{% block title %}Editar Servicio{% endblock %}

{% block content %}
    <div class="card shadow p-4" style="max-width: 600px; margin: auto;">
        <h2 class="mb-4">Editar Servicio</h2>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold">SKU</label>
                <input type="text" class="form-control" value="{{ form.instance.sku }}" readonly disabled>
                <input type="hidden" name="sku" value="{{ form.instance.sku }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Clave SAT</label>
                {{ form.clave_sat }}
            </div>
            <div class="mb-3">
                <label class="form-label">Descripción</label>
                {{ form.descripcion }}
            </div>
            <div class="mb-3">
                <label class="form-label">Unidad SAT</label>
                {{ form.unidad_sat }}
            </div>
            <div class="mb-3">
                <label class="form-label">Precio Unitario</label>
                {{ form.precio_unitario }}
            </div>
            <button type="submit" class="btn btn-warning w-100 mt-3">Guardar Cambios</button>
        </form>
        <a href="{% url 'lista_servicios' %}" class="btn btn-secondary w-100 mt-2">Cancelar</a>
    </div>
{% endblock %}
